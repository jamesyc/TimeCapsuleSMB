version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles

  - package-ecosystem: pip
    directories:
      - /
      # The app's hash-pinned requirements; see RELEASE.md.
      - /macos/TimeCapsuleSMB/tools
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /macos/TimeCapsuleSMB
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
