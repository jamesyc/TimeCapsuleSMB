name: CI

on:
  # The GitHub Pages site in docs/ has nothing for CI to build or test.
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  samba-regressions:
    name: Patched Samba regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Samba test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 git bison flex libparse-yapp-perl libgnutls28-dev zlib1g-dev libpopt-dev
      - name: Build and run the no-pthread Samba tests with sanitizers
        run: python3 -m tests.samba.run host --work "$RUNNER_TEMP/samba-regressions" --jobs "$(nproc)" --sanitizers

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.12"
          - "3.15"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: make install

      - name: Compile the native service
        run: ./build/native/host-check.sh

      - name: Native sanitizer tests
        env:
          TC_NATIVE_SANITIZERS: "1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          # Native children close descriptors up to the host soft limit.
          ulimit -n 256
          # One worker per runner CPU: 3 on macOS, 4 on Ubuntu, which ran
          # these serially in 14 minutes.
          .venv/bin/python -m pytest -n auto --dist worksteal tests/native tests/test_deploy_modules.py

      - name: Run Ruff
        run: |
          .venv/bin/python -m ruff check src tests macos/TimeCapsuleSMB/tools .github/scripts tcapsule
          # One word never goes in this repo; it is split here so the check
          # does not match itself.
          if git grep -n -i 'pony''tail'; then
            echo 'Remove this word from the repo; write a plain comment instead.' >&2
            exit 1
          fi

      - name: Verify checked-in artifact manifest
        run: .venv/bin/python -m pytest tests/test_artifacts.py tests/test_artifact_resolver.py

      - name: Run full test suite
        run: |
          ulimit -n 256
          # The sanitizer step above already ran the native tests.
          .venv/bin/python -m pytest -n 4 --dist worksteal --ignore=tests/native --ignore=tests/test_deploy_modules.py

  swift-test:
    name: Swift Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install helper integration dependencies
        run: make install

      - name: Run Swift tests
        run: swift test --parallel --package-path macos/TimeCapsuleSMB

  package-app:
    # Universal, as releases are: the x86_64 half is checked on every push,
    # not first on a release tag.
    name: Package App (macOS universal)
    runs-on: macos-latest
    needs:
      - swift-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Restore package cache
        uses: actions/cache@v6
        with:
          path: macos/TimeCapsuleSMB/.build/package-app
          key: package-app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/TimeCapsuleSMB/tools/package_app.py', 'macos/TimeCapsuleSMB/tools/*-requirements.txt', 'macos/TimeCapsuleSMB/Package.swift', 'macos/TimeCapsuleSMB/Package.resolved', 'macos/TimeCapsuleSMB/Assets/AppIcon/tcs.jpg', 'pyproject.toml', 'src/**', 'bin/**') }}
          restore-keys: |
            package-app-${{ runner.os }}-${{ runner.arch }}-

      - name: Package and validate universal app
        run: |
          python3 macos/TimeCapsuleSMB/tools/package_app.py \
            --configuration release \
            --arch universal \
            --zip \
            --full-validation

      - name: Keep the app for the Intel check
        uses: actions/upload-artifact@v7
        with:
          name: TimeCapsuleSMB-app
          path: macos/TimeCapsuleSMB/dist/TimeCapsuleSMB.app.zip
          if-no-files-found: error
          retention-days: 3
          # "Re-run all jobs" uploads it again within the same run.
          overwrite: true

  intel-check:
    # Runs the x86_64 half of the app on a real Intel Mac, which packaging on
    # Apple silicon only checks is present. macos-15-intel is GitHub's last
    # Intel image; remove this job when GitHub retires it (fall 2027).
    name: Check App on Intel (macOS 15)
    runs-on: macos-15-intel
    needs:
      - package-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the packaged app
        uses: actions/download-artifact@v8
        with:
          name: TimeCapsuleSMB-app
          path: ${{ runner.temp }}/app

      - name: Launch the app's code on Intel
        run: |
          test "$(uname -m)" = x86_64
          # ditto keeps the bundle's symlinks and permissions, as a user's unzip does.
          ditto -x -k "$RUNNER_TEMP/app/TimeCapsuleSMB.app.zip" "$RUNNER_TEMP/app"
          python3 macos/TimeCapsuleSMB/tools/package_app.py --check-app "$RUNNER_TEMP/app/TimeCapsuleSMB.app"
