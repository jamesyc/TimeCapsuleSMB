name: CI

on:
  # The GitHub Pages site in docs/ has nothing for CI to build or test.
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  samba-regressions:
    name: Patched Samba regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Samba test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 git bison flex libparse-yapp-perl libgnutls28-dev zlib1g-dev libpopt-dev
      - name: Build and run the no-pthread Samba tests with sanitizers
        run: python3 -m tests.samba.run host --work "$RUNNER_TEMP/samba-regressions" --jobs "$(nproc)" --sanitizers

  # Checks against known advisories what users install: pyproject.toml's
  # dependencies, resolved for every Python it allows. Dev tools are left out,
  # as no user runs them. A known vulnerability marks this job failed on every
  # push, but only a release tag waits on it. The packages the Mac app bundles
  # are audited where they are resolved, in package-app and release.
  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The ignored advisories are zeroconf's mDNS bugs in 0.148, the last
      # release for Python 3.9. pyproject.toml gives 3.10 and newer a fixed
      # release, and on macOS the CLI uses dns-sd and never runs zeroconf's
      # packet code, so they reach only Linux on Python 3.9.
      - name: Audit the dependencies users install
        run: >-
          uv audit --no-dev --preview-features audit-command
          --ignore GHSA-9663-mqmp-p9mm
          --ignore GHSA-9pgc-3ccv-5297
          --ignore GHSA-phvx-9mgw-67r5
          --ignore GHSA-qc2x-6f54-m6h9
          --ignore GHSA-rfg2-pjw2-56x2

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.15"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: make install

      # Bootstrap installs with pip into a venv of the user's own Python, which
      # make install's uv does not cover. Run its install step on Python 3.9.
      - name: Install the way bootstrap does
        if: matrix.python-version == '3.9'
        run: |
          venv="$RUNNER_TEMP/bootstrap-venv"
          .venv/bin/python -m venv "$venv"
          .venv/bin/python -c 'import sys; from pathlib import Path; from timecapsulesmb.cli.bootstrap import install_python_requirements; install_python_requirements(Path(sys.argv[1]))' "$venv/bin/python"
          "$venv/bin/python" -c 'import sys, Crypto.Cipher.AES, ifaddr, zeroconf, zopfli.gzip, timecapsulesmb.cli.main; print(sys.version)'
          "$venv/bin/python" -m pip list --format=freeze

      - name: Compile the native service
        run: ./build/native/host-check.sh

      - name: Native sanitizer tests
        env:
          TC_NATIVE_SANITIZERS: "1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          # Native children close descriptors up to the host soft limit.
          ulimit -n 256
          # One worker per runner CPU: 3 on macOS, 4 on Ubuntu, which ran
          # these serially in 14 minutes.
          .venv/bin/python -m pytest -n auto --dist worksteal tests/native tests/test_deploy_modules.py

      - name: Run Ruff
        run: |
          .venv/bin/python -m ruff check src tests macos/TimeCapsuleSMB/tools .github/scripts tcapsule
          # One word never goes in this repo; it is split here so the check
          # does not match itself.
          if git grep -n -i 'pony''tail'; then
            echo 'Remove this word from the repo; write a plain comment instead.' >&2
            exit 1
          fi

      - name: Verify checked-in artifact manifest
        run: .venv/bin/python -m pytest tests/test_artifacts.py tests/test_artifact_resolver.py

      - name: Run full test suite
        run: |
          ulimit -n 256
          # The sanitizer step above already ran the native tests.
          .venv/bin/python -m pytest -n 4 --dist worksteal --ignore=tests/native --ignore=tests/test_deploy_modules.py

  swift-test:
    name: Swift Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"

      - name: Install helper integration dependencies
        run: make install

      - name: Run Swift tests
        run: swift test --parallel --package-path macos/TimeCapsuleSMB

  package-app:
    # Universal, as releases are: the x86_64 half is checked on every push,
    # not first on a release tag.
    name: Package App (macOS universal)
    runs-on: macos-latest
    needs:
      - swift-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # What packaging bundles (the newest Python and packages) is known only
      # once it has resolved them, so the cache is restored by prefix, the
      # newest one saved, and saved after packaging under a key that hashes
      # what the cached folder depends on: the bundled Python and package
      # versions, the packaging code and the icon. The cached site-packages
      # also holds the project, but a push that changes only the sources
      # rebuilds that one entry in seconds; a cache saved for it would help
      # only a rerun of the same commit.
      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v6
        with:
          path: macos/TimeCapsuleSMB/.build/package-app
          # Each cache restores and saves the whole folder, so a cache folder
          # packaging stops using stays until this prefix changes.
          key: package-app-v3-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: |
            package-app-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Package and validate universal app
        run: |
          uv run macos/TimeCapsuleSMB/tools/package_app.py \
            --configuration release \
            --arch universal \
            --zip \
            --full-validation

      - name: Name the package cache
        id: package-cache-key
        run: echo "key=package-app-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/TimeCapsuleSMB/dist/python-packages.txt', 'macos/TimeCapsuleSMB/tools/package_app.py', 'macos/TimeCapsuleSMB/Assets/AppIcon/tcs.jpg') }}" >> "$GITHUB_OUTPUT"

      # A cache restored under this very key holds what this run built already.
      - name: Save package cache
        if: steps.package-cache.outputs.cache-matched-key != steps.package-cache-key.outputs.key
        uses: actions/cache/save@v6
        with:
          path: macos/TimeCapsuleSMB/.build/package-app
          key: ${{ steps.package-cache-key.outputs.key }}

      # The exact packages this build bundled, which packaging resolved and
      # wrote beside the app. Nothing is ignored here, so this also fails if a
      # zeroconf advisory ever covers the release Python 3.10 and newer get.
      - name: Audit the packages the app bundles
        # Like the audit job: a finding fails only a release.
        continue-on-error: true
        run: uvx pip-audit --disable-pip --no-deps -r macos/TimeCapsuleSMB/dist/python-packages.txt

      - name: Keep the app for the Intel check
        uses: actions/upload-artifact@v7
        with:
          name: TimeCapsuleSMB-app
          path: macos/TimeCapsuleSMB/dist/TimeCapsuleSMB.app.zip
          if-no-files-found: error
          retention-days: 3
          # "Re-run all jobs" uploads it again within the same run.
          overwrite: true

  intel-check:
    # Runs the x86_64 half of the app on a real Intel Mac, which packaging on
    # Apple silicon only checks is present. macos-15-intel is GitHub's last
    # Intel image; remove this job when GitHub retires it (fall 2027).
    name: Check App on Intel (macOS 15)
    runs-on: macos-15-intel
    needs:
      - package-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the packaged app
        uses: actions/download-artifact@v8
        with:
          name: TimeCapsuleSMB-app
          path: ${{ runner.temp }}/app

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Launch the app's code on Intel
        run: |
          test "$(uname -m)" = x86_64
          # ditto keeps the bundle's symlinks and permissions, as a user's unzip does.
          ditto -x -k "$RUNNER_TEMP/app/TimeCapsuleSMB.app.zip" "$RUNNER_TEMP/app"
          uv run macos/TimeCapsuleSMB/tools/package_app.py --check-app "$RUNNER_TEMP/app/TimeCapsuleSMB.app"

  # A pushed v* tag builds the release: signed, notarized, its appcast
  # written, checked on a real Intel Mac, then left as a draft release for the
  # maintainer to check and publish. Nothing reaches users before that. Never
  # push a v* tag to test this: every one starts a release.
  release:
    name: Build Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # Packaging takes minutes and notarization waits up to 30 of them.
    timeout-minutes: 90
    needs:
      - samba-regressions
      - audit
      - test
      - swift-test
      - intel-check
    # Only this job gets the signing secrets; the environment admits v* tags only.
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_IDENTITY: "Developer ID Application: Yushen Chang (M22Z394H44)"
    defaults:
      run:
        shell: bash
    outputs:
      prerelease: ${{ steps.gate.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads release.py at the newest published release's tag.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check the tag against release.py and the newest release
        id: gate
        run: |
          newest=$(gh release list --exclude-drafts --json tagName,publishedAt -q 'max_by(.publishedAt).tagName')
          git show "${newest}:src/timecapsulesmb/core/release.py" > "$RUNNER_TEMP/newest_release.py"
          python3 .github/scripts/check_release.py "$GITHUB_REF_NAME" --newest-release-py "$RUNNER_TEMP/newest_release.py"

      - name: Set up the signing keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          # Locked again only after six hours, longer than the job may run.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a dialog no one can click.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          # notarytool stores its profile in the default keychain.
          security default-keychain -s "$keychain"
          # A wrong or expired certificate fails here, not after the build.
          if ! security find-identity -v -p codesigning "$keychain" | grep -F "\"$SIGNING_IDENTITY\"" > /dev/null; then
            # What the import brought in, and macOS's reason for each identity
            # it does not accept. Names, hashes and dates only; no key leaves
            # the keychain. find-certificate exits non-zero when it finds none.
            echo "::group::Signing keychain contents"
            echo "Certificates:"
            security find-certificate -a "$keychain" | sed -n 's/^ *"labl"<blob>=/  /p' || true
            security find-identity -p codesigning "$keychain" || true
            security find-certificate -c "$SIGNING_IDENTITY" -p "$keychain" 2> /dev/null |
              openssl x509 -noout -subject -enddate 2> /dev/null || true
            echo "::endgroup::"
            echo "::error title=Signing keychain::MACOS_CERTIFICATE_P12 holds no valid $SIGNING_IDENTITY; see Signing keychain contents above. A certificate with another name means the wrong certificate was exported; a certificate with no identity means the .p12 lacks its private key; an identity listed with a reason is expired or untrusted."
            exit 1
          fi

      - name: Store the notary profile
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          (umask 077; printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8")
          # An ID set through echo ends in a newline, and notarytool rejects
          # the issuer ID as not a UUID. Neither ID holds whitespace.
          key_id=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')
          issuer_id=$(printf '%s' "$NOTARY_ISSUER_ID" | tr -d '[:space:]')
          # The profile name the release command passes.
          xcrun notarytool store-credentials tcapsulesmb-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$key_id" --issuer "$issuer_id"

      - name: Check the Sparkle key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # A wrong key fails here, not after the build: the appcast step's own
          # check, against the public key packaging writes into the app.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 -c '
          import sys
          sys.path.insert(0, "macos/TimeCapsuleSMB/tools")
          import package_app, sparkle_appcast
          try:
              sparkle_appcast.check_key_matches_app(sys.stdin.buffer.read(), package_app.SPARKLE_PUBLIC_ED_KEY)
          except RuntimeError as exc:
              # On stdout, where GitHub reads workflow commands, as the gate does.
              print(f"::error title=Sparkle key::SPARKLE_ED_PRIVATE_KEY: {exc}")
              sys.exit(1)
          '

      # The maintainer's release command, unchanged. No package cache is
      # restored: branch runs write it, and a release builds everything itself.
      - name: Package, sign and notarize the app
        run: |
          uv run macos/TimeCapsuleSMB/tools/package_app.py \
            --configuration release \
            --arch universal \
            --zip \
            --full-validation \
            --codesign-identity "$SIGNING_IDENTITY" \
            --notarize \
            --notary-profile tcapsulesmb-notary

      # The exact packages this build bundled, which packaging resolved and
      # wrote beside the app. Nothing is ignored here, so this also fails if a
      # zeroconf advisory ever covers the release Python 3.10 and newer get.
      - name: Audit the packages the app bundles
        run: uvx pip-audit --disable-pip --no-deps -r macos/TimeCapsuleSMB/dist/python-packages.txt

      - name: Write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Refused before signing if the key is not the app's or the app is not universal.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | uv run macos/TimeCapsuleSMB/tools/sparkle_appcast.py \
            --zip macos/TimeCapsuleSMB/dist/TimeCapsuleSMB.app.zip \
            --tag "$GITHUB_REF_NAME" \
            --out macos/TimeCapsuleSMB/dist/appcast.xml \
            --ed-key-file -

      - name: Keep the release files for the Intel check and the draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            macos/TimeCapsuleSMB/dist/TimeCapsuleSMB.app.zip
            macos/TimeCapsuleSMB/dist/appcast.xml
          if-no-files-found: error
          # Long enough to re-run a failed draft job after a weekend.
          retention-days: 7
          # "Re-run all jobs" uploads them again within the same run.
          overwrite: true

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

  release-intel-check:
    # The signed, notarized app's x86_64 half (hardened runtime, library
    # validation, Gatekeeper) on a real Intel Mac, which the ad-hoc intel-check
    # cannot show. Remove with intel-check when GitHub retires macos-15-intel.
    name: Check Release on Intel (macOS 15)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    timeout-minutes: 20
    needs:
      - release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Launch the release on Intel and assess it with Gatekeeper
        run: |
          test "$(uname -m)" = x86_64
          ditto -x -k "$RUNNER_TEMP/release/TimeCapsuleSMB.app.zip" "$RUNNER_TEMP/release/app"
          app="$RUNNER_TEMP/release/app/TimeCapsuleSMB.app"
          uv run macos/TimeCapsuleSMB/tools/package_app.py --check-app "$app"
          spctl -a -t exec -vvv "$app"

  release-draft:
    name: Create Draft Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release
      - release-intel-check
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # A hidden build (a -N version) is a prerelease draft: publishing it
      # never moves Latest, so never the feed either.
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Create the draft
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "### macOS GUI installer app (for macOS 14+)" \
            "${prerelease[@]}" \
            release/TimeCapsuleSMB.app.zip \
            release/appcast.xml
