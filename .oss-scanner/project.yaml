# TimeCapsuleSMB exposes modern SMB on legacy Apple network storage, protecting
# users' shared files and Time Machine backups through its own runtime and
# downstream Samba fixes. It is a maintained deployment/runtime project,
# rather than a mirror of upstream Samba.
