[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timecapsulesmb"
version = "3.3.1-1"
description = "Deploy modern Samba to Apple AirPort Time Capsules."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "James Chang" },
]
keywords = [
  "airport-time-capsule",
  "bonjour",
  "macos",
  "netbsd",
  "samba",
  "smb",
  "time-machine",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Networking",
]
dependencies = [
  "ifaddr>=0.2.0",
  "pycryptodome>=3.20.0,<4",
  "zopfli>=0.2.3.post1",
  "zeroconf>=0.148.0",
]

[project.urls]
Homepage = "https://github.com/jamesyc/TimeCapsuleSMB"
Documentation = "https://github.com/jamesyc/TimeCapsuleSMB#readme"
FAQ = "https://github.com/jamesyc/TimeCapsuleSMB/blob/main/FAQ.md"
Issues = "https://github.com/jamesyc/TimeCapsuleSMB/issues"
Releases = "https://github.com/jamesyc/TimeCapsuleSMB/releases"
Source = "https://github.com/jamesyc/TimeCapsuleSMB"

[project.optional-dependencies]
dev = [
  # CLDR plural rules for the macOS catalog tests; not bundled into the app.
  "babel",
  "coverage>=7.6.0",
  "pytest>=8.4.0,<10",
  "pytest-xdist>=3.6.1,<4",
  "ruff>=0.12.0,<1",
]

[project.scripts]
tcapsule = "timecapsulesmb.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
timecapsulesmb = [
  "assets/artifact-manifest.json",
  "assets/boot/samba4/*",
  "transport/ssh-askpass",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["src/timecapsulesmb"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
  "real_keep_awake: may start a real caffeinate child instead of the no-op that tests get by default",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  # Unused imports and variables hid code left over from removed features.
  "F401",
  "F841",
  # Local programs start through core.process's posix_spawn helpers.
  "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.run".msg = "use core.process.run_process: a forked child can crash on macOS (issue #371)"
"subprocess.Popen".msg = "use core.process.popen_process: a forked child can crash on macOS (issue #371)"
"subprocess.call".msg = "use core.process.run_process"
"subprocess.check_call".msg = "use core.process.run_process"
"subprocess.check_output".msg = "use core.process.run_process"
"subprocess.getoutput".msg = "use core.process.run_process"
"subprocess.getstatusoutput".msg = "use core.process.run_process"
"os.fork".msg = "spawn with posix_spawn: a forked child can crash on macOS (issue #371)"
"os.forkpty".msg = "spawn with posix_spawn: a forked child can crash on macOS (issue #371)"
"os.system".msg = "use core.process.run_process"
"os.popen".msg = "use core.process.run_process"
"pty".msg = "pty.fork forks: a forked child can crash on macOS (issue #371)"
"os.spawnl".msg = "use core.process.run_process"
"os.spawnle".msg = "use core.process.run_process"
"os.spawnlp".msg = "use core.process.run_process"
"os.spawnlpe".msg = "use core.process.run_process"
"os.spawnv".msg = "use core.process.run_process"
"os.spawnve".msg = "use core.process.run_process"
"os.spawnvp".msg = "use core.process.run_process"
"os.spawnvpe".msg = "use core.process.run_process"
"asyncio.create_subprocess_exec".msg = "use core.process.popen_process"
"asyncio.create_subprocess_shell".msg = "use core.process.popen_process"
"multiprocessing".msg = "do not fork the application process; use core.process"
"platform.platform".msg = "may fork uname; use platform.system/release/machine"
"platform.processor".msg = "may fork uname; use platform.machine"

[tool.ruff.lint.per-file-ignores]
# The helpers themselves; tests and the packaging tools run on the build host.
"src/timecapsulesmb/core/process.py" = ["TID251"]
"tests/**" = ["TID251"]
"macos/**" = ["TID251"]
"build/**" = ["TID251"]
